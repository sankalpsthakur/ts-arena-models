name: gridload-compact check
on: [push, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gridload-compact model-services/gridload-compact
      - name: Start container
        run: |
          docker run -d --rm -p 8000:8000 --name gl gridload-compact
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health >/dev/null && break; curl -sf http://localhost:8000/openapi.json >/dev/null && break; sleep 2; done
          docker logs gl | tail -20
      - name: Harness deps
        run: python -m pip install -q numpy
      - name: Harness 15min x 96
        run: for m in single batch; do python model-services/tests/run_harness.py --url http://localhost:8000/predict --horizon 96 --freq 15min --mode $m; done
      - name: Harness h x 72
        run: for m in single batch; do python model-services/tests/run_harness.py --url http://localhost:8000/predict --horizon 72 --freq h --mode $m; done
      - name: Harness h x 24
        run: for m in single batch; do python model-services/tests/run_harness.py --url http://localhost:8000/predict --horizon 24 --freq h --mode $m; done
      - name: Container request timing (single-mode harness, wall time, 5 runs)
        run: for i in 1 2 3 4 5; do /usr/bin/time -f "harness single 15min wall %e s" python model-services/tests/run_harness.py --url http://localhost:8000/predict --horizon 96 --freq 15min --mode single >/dev/null; done
      - name: Service unit tests inside the image
        run: docker run --rm --entrypoint sh gridload-compact -c "python -m pip install -q pytest httpx && python -m pytest -q /app/tests || python -m pytest -q tests" || echo "unit tests not run inside the image (path differs); see the repository tests"
      - name: Compose build through the repository's own compose
        run: docker compose --profile gridload-compact -f docker-compose.yml build gridload-compact
      - name: Image size
        run: docker image ls gridload-compact --format '{{.Repository}} {{.Size}}'
